name: Unified museum checks

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/unified-museum

permissions:
  contents: read

concurrency:
  group: museum-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Test the actual PR head or push commit, never a moving branch name.
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  current-slice:
    name: Current slice / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source commit
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Commit: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Set up Node
        # https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, test and build current slice
        run: npm run check

  legacy-baseline:
    name: Preserved source baseline (not adapter acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Commit: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run archived source compatibility baseline
        run: npm run test:legacy
